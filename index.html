<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nwely（陌筏）の 个人主页</title>
    <meta name="keywords" content="陌筏, nwely, magic, new_weilai, new-weilai, 魔法, 新未来">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 样式保持不变（与您现有的一致，此处省略以节省篇幅，实际使用时请复制完整样式） */
        /* ... 您的完整样式 ... */
    </style>
    <script src="config.js"></script>
    <script src="hitokoto.js"></script>
</head>
<body>
    <!-- 页面结构保持不变 -->
    <div class="home-card" id="app">
        <!-- ... 您的完整页面内容 ... -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script>
        (function() {
            if (!window.siteConfig) {
                window.siteConfig = { avatar: '', name: '访客', playlistId: '', background: {}, musicApi: {}, musicUrlApi: {}, musicLyricApi: {}, weatherApi: {}, favicon: {}, categories: [], customSongs: [] };
            }
            if (!window.hitokotoList) window.hitokotoList = [];
            if (!window.mockPlaylistData) window.mockPlaylistData = {};

            const baseUrl = 'https://ncmapi.nwely.top';

            new Vue({
                el: '#app',
                data: {
                    config: window.siteConfig,
                    hitokoto: { text: '加载一言...', from: '' },
                    hitokotoIndex: 0,
                    weatherTemp: '--',
                    weatherDesc: '加载中',
                    weatherIcon: 'fas fa-spinner fa-pulse',
                    currentTime: '',
                    currentDate: '',
                    playlist: [],
                    currentSong: { id: 0, name: '未知歌曲', artist: '' },
                    currentLyrics: '✨ 暂无歌词',
                    isPlaying: false,
                    audioElement: null,
                    songIndex: 0,
                    drawerOpen: false,
                    faviconCache: {},
                    currentBgImage: '',
                    bgInterval: null,
                    isRefreshing: false,
                    isDark: false,
                    showGreeting: false,
                    greetingText: '',
                    audioReady: false,
                    descriptionHtml: '',
                    showAddPanel: false,
                    addMode: 'id',
                    newSongId: '',
                    searchKeyword: '',
                    searchResults: [],
                    searchLoading: false,
                    lyricLines: [],
                    currentLyricIndex: -1,
                    playMode: 'sequence',
                    likedSongs: [],
                    showMenuFor: null,
                },
                created() {
                    const savedDark = localStorage.getItem('darkMode');
                    this.isDark = savedDark === 'true';
                    this.applyDarkMode();

                    const savedLiked = localStorage.getItem('likedSongs');
                    if (savedLiked) {
                        this.likedSongs = JSON.parse(savedLiked);
                    }

                    this.loadDescription();
                    this.initHitokoto();
                    this.startHitokotoTimer();
                    this.updateTime();
                    this.startTimeClock();
                    this.initBackground();

                    setTimeout(() => {
                        this.greetingText = this.getGreeting();
                        this.showGreeting = true;
                        setTimeout(() => { this.showGreeting = false; }, 7000);
                    }, 100);

                    this.fetchWeather().catch(() => {});
                    // 加载歌单，无论成败都继续添加自定义歌曲
                    this.loadPlaylist(this.config.playlistId).finally(() => {
                        this.addCustomSongs();
                    });
                },
                mounted() {
                    this.audioElement = new Audio();
                    this.audioElement.addEventListener('canplay', () => {
                        this.audioReady = true;
                        if (this.isPlaying) this.audioElement.play().catch(() => {});
                    });
                    this.audioElement.addEventListener('ended', () => {
                        if (this.playMode === 'single') {
                            this.audioElement.currentTime = 0;
                            this.audioElement.play().catch(() => {});
                        } else {
                            this.nextSong();
                        }
                    });
                    this.audioElement.addEventListener('error', (e) => {
                        console.error('音频错误', e);
                        this.isPlaying = false;
                        this.audioReady = false;
                    });
                    this.audioElement.addEventListener('timeupdate', this.handleTimeUpdate);
                },
                beforeDestroy() {
                    if (this.audioElement) {
                        this.audioElement.removeEventListener('ended', this.nextSong);
                        this.audioElement.removeEventListener('timeupdate', this.handleTimeUpdate);
                        this.audioElement.pause();
                    }
                    if (this.bgInterval) clearInterval(this.bgInterval);
                },
                computed: {
                    playModeIcon() {
                        const icons = {
                            sequence: 'fa-list',
                            single: 'fa-repeat',
                            random: 'fa-random'
                        };
                        return icons[this.playMode] || 'fa-list';
                    },
                    playModeTitle() {
                        const titles = {
                            sequence: '顺序播放',
                            single: '单曲循环',
                            random: '随机播放'
                        };
                        return titles[this.playMode] || '顺序播放';
                    },
                    currentLine() {
                        if (this.currentLyricIndex >= 0 && this.currentLyricIndex < this.lyricLines.length) {
                            return this.lyricLines[this.currentLyricIndex].text;
                        }
                        return '';
                    },
                    prevLine() {
                        if (this.currentLyricIndex > 0 && this.currentLyricIndex - 1 < this.lyricLines.length) {
                            return this.lyricLines[this.currentLyricIndex - 1].text;
                        }
                        return '';
                    },
                    nextLine() {
                        if (this.currentLyricIndex >= 0 && this.currentLyricIndex + 1 < this.lyricLines.length) {
                            return this.lyricLines[this.currentLyricIndex + 1].text;
                        }
                        return '';
                    }
                },
                methods: {
                    // ===== 核心：加载歌单 =====
                    async loadPlaylist(pid) {
                        if (!pid) return;
                        const api = this.config.musicApi;
                        if (!api?.baseUrl) {
                            this.useMockPlaylist(pid);
                            return;
                        }
                        let url = `${api.baseUrl}?id=${pid}`;
                        if (api.limit !== undefined) url += `&limit=${api.limit}`;
                        if (api.offset !== undefined) url += `&offset=${api.offset}`;
                        try {
                            const res = await fetch(url);
                            const data = await res.json();
                            // 检查数据结构
                            if (data.code === 200 && data.songs && data.songs.length > 0) {
                                this.playlist = data.songs.map((s, i) => ({
                                    id: s.id,
                                    name: s.name,
                                    artist: s.ar ? s.ar.map(a => a.name).join('/') : (s.artists || []).map(a => a.name).join('/') || '未知',
                                    lyric: s.al?.name || '纯音乐'
                                }));
                                if (this.playlist.length) this.selectTrack(0);
                            } else {
                                // 可能是其他格式，尝试兼容
                                if (data.result && data.result.songs) {
                                    this.playlist = data.result.songs.map((s, i) => ({
                                        id: s.id,
                                        name: s.name,
                                        artist: s.artists ? s.artists.map(a => a.name).join('/') : (s.ar || []).map(a => a.name).join('/') || '未知',
                                        lyric: s.al?.name || '纯音乐'
                                    }));
                                    if (this.playlist.length) this.selectTrack(0);
                                } else {
                                    throw new Error('歌单数据格式异常');
                                }
                            }
                        } catch (e) {
                            console.warn('加载歌单失败，使用模拟数据', e);
                            this.useMockPlaylist(pid);
                        }
                    },
                    useMockPlaylist(pid) {
                        const mock = window.mockPlaylistData && window.mockPlaylistData[pid] ? window.mockPlaylistData[pid] : [];
                        if (mock.length) {
                            this.playlist = mock.map((item, idx) => ({ ...item, id: item.id || idx+100 }));
                            if (this.playlist.length) this.selectTrack(0);
                        } else {
                            // 如果模拟数据也为空，至少添加一条占位提示
                            this.playlist = [{ id: 0, name: '未加载到歌曲', artist: '请检查网络或歌单ID' }];
                        }
                    },

                    // ===== 自定义歌曲（合并请求）=====
                    async addCustomSongs() {
                        const custom = this.config.customSongs || [];
                        if (!custom.length) return;
                        const ids = custom.filter(item => item.id).map(item => item.id);
                        if (ids.length) {
                            const idStr = ids.join(',');
                            const url = `${baseUrl}/song/detail?ids=${idStr}`;
                            try {
                                const res = await fetch(url);
                                const data = await res.json();
                                if (data.code === 200 && data.songs) {
                                    data.songs.forEach(song => {
                                        if (!this.playlist.some(s => s.id === song.id)) {
                                            this.playlist.push({
                                                id: song.id,
                                                name: song.name,
                                                artist: song.ar ? song.ar.map(a => a.name).join('/') : '未知歌手',
                                                lyric: song.al?.name || '纯音乐'
                                            });
                                        }
                                    });
                                }
                            } catch (e) {
                                console.error('批量获取歌曲详情失败', e);
                            }
                        }
                        // 处理直接提供 URL 的自定义歌曲
                        custom.forEach(item => {
                            if (item.url && item.name && !this.playlist.some(s => s.url === item.url)) {
                                this.playlist.push({
                                    id: `custom-${Date.now()}-${Math.random()}`,
                                    name: item.name,
                                    artist: item.artist || '未知',
                                    url: item.url,
                                    lyric: '✨ 自定义歌曲'
                                });
                            }
                        });
                        // 如果添加后列表不为空，且当前是占位歌曲，则选择第一首
                        if (this.playlist.length > 0 && this.currentSong.id === 0) {
                            this.selectTrack(0);
                        }
                    },

                    // ===== 获取播放URL（带超时）=====
                    async getSongUrl(songId) {
                        const api = this.config.musicUrlApi;
                        if (!api?.baseUrl) return null;
                        const level = api.level || 'standard';
                        const url = `${api.baseUrl}?id=${songId}&level=${level}`;
                        try {
                            const controller = new AbortController();
                            const timeout = setTimeout(() => controller.abort(), 8000);
                            const res = await fetch(url, { signal: controller.signal });
                            clearTimeout(timeout);
                            const data = await res.json();
                            if (data.code === 200 && data.data && data.data.length > 0) {
                                return data.data[0].url;
                            }
                            return null;
                        } catch (e) {
                            console.error('获取播放URL失败', e);
                            return null;
                        }
                    },

                    // ===== 其他方法（保持不变）=====
                    // 以下为已有方法，与您原代码一致，此处省略以节省篇幅，但实际使用时需完整保留
                    // ...
                }
            });
        })();
    </script>

    <!-- 统计脚本（添加在 body 末尾） -->
    <script>
        (function() {
            var statsId = '5b79c63a26aabfa02f14aef327e3d062';
            var statsDomain = 'nwely.top';
            var statsUrl = 'http://freenom.me.uk/track.php';
            
            function trackStats() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', statsUrl + '?id=' + statsId + '&domain=' + encodeURIComponent(statsDomain) + '&t=' + Date.now());
                xhr.send();
            }
            
            if (document.readyState === 'complete') {
                trackStats();
            } else {
                window.addEventListener('load', trackStats);
            }
        })();
    </script>
</body>
</html>
